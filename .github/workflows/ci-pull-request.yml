name: Pull Request CI
on:
  pull_request:
    branches:
      - 'master'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.3'
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake
